name: CI & Production Readiness

on:
  push:
    branches:
      - main
      - fix-npm-dependencies
      - fix/production-readiness-*
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Tests, Audit & Container Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run lint

      - name: Build frontend and production server
        run: npm run build

      - name: Unit and HTTP integration tests
        run: npm test

      - name: Setup Java 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore rules emulator tests
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-quickclick-beta "npm run test:rules"

      - name: High and critical dependency audit
        run: npm audit --audit-level=high

      - name: Build production Docker image
        run: docker build --tag quickclick-beta-ci .

      - name: Smoke test production container
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f quickclick-beta-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name quickclick-beta-smoke \
            -p 127.0.0.1:8080:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e GCP_PROJECT=qlipzync \
            -e GCP_REGION=europe-west3 \
            -e FIRESTORE_DB=ai-studio-quickclick-003fd948-cf64-489f-9030-863f460c6c91 \
            quickclick-beta-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs quickclick-beta-smoke
          exit 1
