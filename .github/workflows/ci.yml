name: CI & Build Test

on:
  push:
    branches:
      - main
      - fix/production-readiness-2026-10-16
      - fix-npm-dependencies
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, build and container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run lint

      - name: Build frontend and production server
        run: npm run build

      - name: Run application tests
        run: npm test

      - name: Build production container
        run: docker build --tag quickclick-beta:${{ github.sha }} .
