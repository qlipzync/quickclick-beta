name: Repair npm lockfile

on:
  push:
    branches:
      - fix/stripe-webhook-production-safety-2026-10-17
    paths:
      - '.github/workflows/repair-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate and validate package-lock.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps

      - name: Verify strict clean installation
        run: npm ci --legacy-peer-deps

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize npm lockfile with package.json"
          git push origin "HEAD:${GITHUB_REF_NAME}"
