name: 'Build and Deploy to Cloud Run'
# Repository: https://github.com/qlipzync/qlipZync-repo
# Target: Google Cloud Run Service quickclick-app (Region europe-west3)
# WIF Pool: projects/248792984033/locations/global/workloadIdentityPools/github-pool/providers/github-provider
# WIF Principal: principalSet://iam.googleapis.com/.../attribute.repository/qlipzync/qlipZync-repo

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PROJECT_ID: 'qlipzync'
  PROJECT_NUMBER: '248792984033'
  REGION: 'europe-west3'
  SERVICE: 'quickclick-app'
  SERVICE_ACCOUNT: 'qlipzync-runner@qlipzync.iam.gserviceaccount.com'

jobs:
  deploy:
    name: 'Deploy to Google Cloud Run'
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v4'

      # Authentifizierung: Bevorzugt schlüsselloses WIF, mit direktem SA-Key-Fallback falls als Secret hinterlegt
      - id: 'auth-wif'
        if: "${{ secrets.GCP_SA_KEY == '' }}"
        name: 'Authenticate to Google Cloud via WIF'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/248792984033/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '${{ env.SERVICE_ACCOUNT }}'

      - id: 'auth-key'
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        name: 'Authenticate to Google Cloud via Service Account Key'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          project_id: '${{ env.PROJECT_ID }}'

      - name: 'Deploy to Cloud Run via Cloud Build'
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --source . \
            --region "${{ env.REGION }}" \
            --allow-unauthenticated \
            --service-account "${{ env.SERVICE_ACCOUNT }}" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars NODE_ENV=production
