name: Build and Deploy to Cloud Run (Docker & WIF)

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: qlipzync
  PROJECT_NUMBER: "248792984033"
  REGION: europe-west3
  SERVICE_NAME: quickclick-app
  SERVICE_ACCOUNT: qlipzync-runner@qlipzync.iam.gserviceaccount.com
  FIRESTORE_DB: ai-studio-quickclick-003fd948-cf64-489f-9030-863f460c6c91
  WIF_REPOSITORY: qlipzync/quickclick-beta
  WIF_PROVIDER: projects/248792984033/locations/global/workloadIdentityPools/github-pool/providers/github-provider

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER || env.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT || env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Container Registry / Artifact Registry
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and Push Container Image
        run: |
          docker build -t gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA .
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA

      - name: Deploy Container to Google Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ env.SERVICE_ACCOUNT }}
            --port=3000
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=10
            --set-env-vars=NODE_ENV=production,FIRESTORE_DB=${{ env.FIRESTORE_DB }},GCP_PROJECT=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }}

      - name: Verify Cloud Run Health Endpoint
        run: |
          echo "Deployed successfully to ${{ steps.deploy.outputs.url }}"
          curl -fsS "${{ steps.deploy.outputs.url }}/api/health" | grep -q '"status":"healthy"'
