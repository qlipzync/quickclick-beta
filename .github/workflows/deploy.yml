name: Deploy QuickClick to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: qlipzync
  REGION: europe-west3
  SERVICE: quickclick-app
  SERVICE_ACCOUNT: qlipzync-runner@qlipzync.iam.gserviceaccount.com
  FIRESTORE_DB: ai-studio-quickclick-003fd948-cf64-489f-9030-863f460c6c91

jobs:
  verify:
    name: Verify before deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run lint

      - name: Build frontend and production server
        run: npm run build

      - name: Unit and HTTP integration tests
        run: npm test

      - name: Setup Java 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore rules emulator tests
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-quickclick-beta "npm run test:rules"

      - name: High and critical dependency audit
        run: npm audit --audit-level=high

      - name: Build production Docker image
        run: docker build --tag quickclick-beta-predeploy .

      - name: Smoke test production container
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f quickclick-beta-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name quickclick-beta-smoke \
            -p 127.0.0.1:8080:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e GCP_PROJECT=${{ env.PROJECT_ID }} \
            -e GCP_REGION=${{ env.REGION }} \
            -e FIRESTORE_DB=${{ env.FIRESTORE_DB }} \
            quickclick-beta-predeploy
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs quickclick-beta-smoke
          exit 1

  deploy:
    name: Deploy verified main branch only
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/248792984033/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --source . \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --allow-unauthenticated \
            --service-account "${{ env.SERVICE_ACCOUNT }}" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "NODE_ENV=production,GCP_PROJECT=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }},FIRESTORE_DB=${{ env.FIRESTORE_DB }}"
