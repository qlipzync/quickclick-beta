name: Deploy QuickClick to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: qlipzync
  REGION: europe-west3
  SERVICE: quickclick-app
  SERVICE_ACCOUNT: qlipzync-runner@qlipzync.iam.gserviceaccount.com
  FIRESTORE_DB: ai-studio-quickclick-003fd948-cf64-489f-9030-863f460c6c91

jobs:
  verify:
    name: Verify before deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run lint
      - name: Build frontend and production server
        run: npm run build
      - name: Run application tests
        run: npm test
      - name: Build production container
        run: docker build --tag quickclick-beta:${{ github.sha }} .

  deploy:
    name: Deploy verified main branch
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/248792984033/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ env.SERVICE_ACCOUNT }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --source . \
            --region "${{ env.REGION }}" \
            --allow-unauthenticated \
            --service-account "${{ env.SERVICE_ACCOUNT }}" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "NODE_ENV=production,FIRESTORE_DB=${{ env.FIRESTORE_DB }}"
