name: 'Deploy QlipZync to Cloud Run'
# Repository: https://github.com/qlipzync/qlipZync-repo
# Target: Google Cloud Run Service quickclick-app (Region europe-west3)
# Scale-to-Zero: --min-instances 0 (0 € Idle Cost)

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PROJECT_ID: 'qlipzync'
  PROJECT_NUMBER: '248792984033'
  REGION: 'europe-west3'
  SERVICE: 'quickclick-app'
  SERVICE_ACCOUNT: 'qlipzync-runner@qlipzync.iam.gserviceaccount.com'
  FIRESTORE_DB: 'ai-studio-quickclick-003fd948-cf64-489f-9030-863f460c6c91'

jobs:
  deploy:
    name: 'Build and Deploy to Cloud Run'
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v4'

      - name: 'Setup Node.js 22'
        uses: 'actions/setup-node@v4'
        with:
          node-version: 22
          cache: 'npm'

      - name: 'Install Dependencies'
        run: npm ci --legacy-peer-deps

      - name: 'Run Typecheck & Lint'
        run: npm run lint

      - name: 'Run unit and configuration regression tests'
        run: npm test

      - name: 'Run Firestore rules emulator tests'
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-quickclick-beta "npm run test:rules"

      - name: 'Build frontend and production server'
        run: npm run build

      - name: 'Validate production Docker build'
        run: docker build --tag quickclick-beta-predeploy .

      # Authentifizierung: Bevorzugt schlüsselloses WIF, mit direktem SA-Key-Fallback falls als Secret hinterlegt
      - id: 'auth-wif'
        if: "${{ secrets.GCP_SA_KEY == '' }}"
        name: 'Authenticate to Google Cloud via WIF'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/248792984033/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '${{ env.SERVICE_ACCOUNT }}'

      - id: 'auth-key'
        if: "${{ secrets.GCP_SA_KEY != '' }}"
        name: 'Authenticate to Google Cloud via Service Account Key'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          project_id: '${{ env.PROJECT_ID }}'

      - name: 'Deploy to Cloud Run via Cloud Build'
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --source . \
            --region "${{ env.REGION }}" \
            --allow-unauthenticated \
            --service-account "${{ env.SERVICE_ACCOUNT }}" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "NODE_ENV=production,GCP_PROJECT=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }},FIRESTORE_DB=${{ env.FIRESTORE_DB }}"
